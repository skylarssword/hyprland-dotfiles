$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles
source = colors.conf
general {
    ignore_empty_input = true
}
background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
}
# small date, top-left, matching SDDM
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $primary
    font_size = 20
    font_family = Google Sans Flex Freeze
    position = 60, -50
    halign = left
    valign = top
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.4
}
# avatar, centered, bigger circle
image {
    monitor =
    path = $ml4w_cache_folder/square_wallpaper.png
    size = 300
    rounding = -1
    border_size = 3
    border_color = $primary $on_primary 90deg
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.6
}
# password field — hidden until you start typing, shifted down
input-field {
    monitor =
    size = 220, 55
    dots_size = 0.33
    dots_spacing = 0.2
    dots_center = true
    inner_color = rgba(15, 25, 45, 0.55)
    font_color = rgba(255, 255, 255, 1.0)
    outer_color = $primary
    outline_thickness = 3
    rounding = 27
    fade_on_empty = true
    fade_timeout = 0
    hide_input = false
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -160
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.6
}
# greeting, bottom-right
label {
    monitor =
    text = See you soon, $USER.
    color = $primary
    font_size = 16
    font_family = Google Sans Flex Freeze
    position = -50, 100
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.4
}
# clock, bottom-right, below greeting
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    color = $primary
    font_size = 44
    font_family = Google Sans Flex Freeze
    position = -50, 40
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.4
}
