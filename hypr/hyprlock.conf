$font = Google Sans Flex Freeze
$white = rgba(255, 255, 255, 1.0)
$muted = rgba(255, 255, 255, 0.82)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    path =
    color = rgba(12, 16, 28, 1.0)
    blur_passes = 0
    reload_time = -1
    reload_cmd = /home/userone/.config/hypr/hyprlock/random-wallpaper.sh
    crossfade_time = 0.4
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = $muted
    font_size = 18
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.28)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M'
    color = $white
    font_size = 88
    font_family = $font
    position = 0, -125
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.28)
}

# Greeting
label {
    monitor =
    text = $USER
    color = $white
    font_size = 18
    font_family = $font
    position = 0, -240
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.28)
}

# Profile picture
image {
    monitor =
    path = ~/.config/hypr/hyprlock/vivek.png
    size = 72
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.65)
    position = 0, -290
    halign = center
    valign = top
}

# Password field
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.24)
    inner_color = rgba(18, 22, 32, 0.28)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Type Password
    hide_input = false
    rounding = 16
    check_color = rgba(160, 205, 255, 1.0)
    fail_color = rgba(255, 115, 115, 1.0)
    fail_text = Try again
    position = 0, -950
    halign = center
    valign = top
}
